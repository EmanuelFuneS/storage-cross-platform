services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # Variables que ahora pide tu entrypoint.sh
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: mydb
      # Mantén esta si tu app o Zod la siguen usando directamente
      DATABASE_URL: postgresql://postgres:password@host.docker.internal:5432/mydb
      AUTH_SECRET: dev-secret
      PRESIGNED_LAMBDA_URL: dev-url
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
