name: Deploy Storage App

on:
  push:
    branches:
      - development
    paths:
      - ".github/workflows/**"

jobs:
  release:
    name: Development Storage App Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secrect-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Diff
        working-directory: apps/cdk-app
        run: pnpm cdk diff network-stack storage-stack

      - name: CDK Deploy Base S3
        working-directory: apps/cdk-app
        run: pnpm cdk deploy network-stack storage-stack --require-approval never
