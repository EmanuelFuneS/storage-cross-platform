name: Prod Deploy Storage App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'prod'
        type: choice
        options:
          - staging
          - prod

jobs:
  release:
    name: Build & Deploy Storage APP
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Diff
        working-directory: apps/cdk-app
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ github.sha }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm cdk diff --all --context environment=$ENVIRONMENT

      - name: CDK Deploy Base (Network & Storage & DB)
        working-directory: apps/cdk-app
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: pnpm cdk deploy --context environment=$ENVIRONMENT storage-prod-network storage-prod-bucket storage-prod-db --require-approval never

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/storage-app-${{ github.event.inputs.environment || 'prod' }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/storage-app-${{ github.event.inputs.environment || 'prod' }}:latest

      - name: CDK Deploy App
        id: cdk-deploy
        working-directory: apps/cdk-app
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
          IMAGE_TAG: ${{ github.sha }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm cdk deploy --context environment=$ENVIRONMENT storage-prod-app --require-approval never

      - name: Get Seed Lambda name
        id: get-lambda
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "storage-$ENVIRONMENT-app" \
            --query "Stacks[0].Outputs[?contains(OutputKey,'SeedLambdaName')].OutputValue" \
            --output text)
          echo "function-name=$FUNCTION_NAME" >> "$GITHUB_OUTPUT"

      - name: Run DB Seeds
        run: |
          aws lambda invoke \
            --function-name ${{ steps.get-lambda.outputs.function-name }} \
            --payload '{}' \
            /tmp/seed-response.json
          cat /tmp/seed-response.json